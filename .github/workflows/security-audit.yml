name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@cdc6cb21f67428d53742baec302ab074f93014e6  # v3.5.19
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
