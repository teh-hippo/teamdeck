name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@818b20188987583b2dfefb1c04f9c898fa8f0d87  # v3.2.16
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
