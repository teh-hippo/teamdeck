name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@a511f54718e6710945af5ee1509ed8408636b6bb  # v3.2.12
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
