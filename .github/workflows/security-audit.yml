name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@74d034769502f1c91c91c58b524ac912733e5c98  # v3.2.5
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
