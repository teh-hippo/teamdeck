name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@01954ab5428ef027016e06c69d0d68389737f299  # v3.5.2
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
