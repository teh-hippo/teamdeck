name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@6b856d362cc47fe0387eeb6349d29376c5abb35c  # v3.5.11
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
