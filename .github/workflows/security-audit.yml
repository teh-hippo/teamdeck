name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@5928973d0de2de7076a3e0d2f32c14556e0c436e  # v3.2.27
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
