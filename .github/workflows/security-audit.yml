name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@d71c5d1def95b72227ef165825d3f6d51affa46b  # v3.2.6
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
