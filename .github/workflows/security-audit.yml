name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@ce9adfb359fc249f59717d9f72aa4d3052e850cf  # v3.5.5
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
