name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@273586e2942b6a33b4c4c82754d33b738ee00a7e  # v3.2.23
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
