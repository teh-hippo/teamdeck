name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@b931aca4b15cb636891d2037f3cc9b7bfd33e2c3  # v3.4.0
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
