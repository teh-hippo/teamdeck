name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@942482e4a5c6c04b2cedf484c8cbd7e186365619  # v3.2.34
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
