name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@4f262c45ec03f02a27a401c73ac7d87ece2da5aa  # v3.2.18
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
