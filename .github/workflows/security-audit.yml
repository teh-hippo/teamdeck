name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@c1f6e14d19d179825ee1d4a691a86b3adb943a5e  # v3.5.9
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
