name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@cb3f6e4957f9233f9587728af358a1b2b764229a  # v3.2.19
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
