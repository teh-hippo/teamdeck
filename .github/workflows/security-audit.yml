name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@b6757ad28cf4fae44c99a5a462bc14cf19dce1ab  # v3.5.0
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
