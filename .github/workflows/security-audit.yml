name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@2b812790ff0a2cec9bd31eeae1f62876485746b3  # v3.2.7
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
