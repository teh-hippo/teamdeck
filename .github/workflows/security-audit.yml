name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@52305ee7afe0528969eb59110bc876ac7092669b  # v3.2.11
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
