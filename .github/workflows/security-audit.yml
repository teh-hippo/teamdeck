name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@f4be12d62c57181f39424bf4ff8460141ed43649  # v3.2.15
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
