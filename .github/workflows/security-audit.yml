name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@2ef31dcb7762991f63ff1feda56b08a013f8fb34  # v3.2.3
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
