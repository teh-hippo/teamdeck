name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@4ca742eda76e2a05421784306ae95f5f36958b4d  # v3.2.13
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
