name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@3472be29741b4b64888144d58766c9e84dc07b78  # v3.2.0
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
