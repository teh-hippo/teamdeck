name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@5fa0d421729c9ac2c385f7b8248a89db5e4dbddd  # v3.2.31
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
