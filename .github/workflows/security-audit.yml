name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@480653c2278884104b02bb6f1f5d7ec82842d572  # v3.2.30
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
