name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@04132673f8dbfe520b09cdc14fc08c83c34ea6bf  # v3.5.15
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
