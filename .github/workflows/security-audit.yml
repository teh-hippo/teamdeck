name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@d29dea586d85c4e459e4beffa1ae21b40d12094f  # v3.2.25
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
