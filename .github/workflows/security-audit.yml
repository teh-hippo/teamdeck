name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@42a6dbffdbffd3fd5c1f2106dba4be2bc2c07cc8  # v3.5.4
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
