name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@f9387d1201e2c7e31ccdd7a1a04152f2f31ac557  # v3.2.26
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
