name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@eee488b0ce33a69705c74bfbff0aa4ebc67c68e8  # v3.5.10
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
