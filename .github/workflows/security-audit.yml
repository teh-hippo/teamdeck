name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@be8902b405b3302103da109a66c29d539800289d  # v3.2.9
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
