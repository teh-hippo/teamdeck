name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@1ce408bcb79902cdc160a6aa302c3c0c9dc9e594  # v3.5.20
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
