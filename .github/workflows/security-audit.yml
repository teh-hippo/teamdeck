name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@778f7142cbecf7575c087348541a2cf06fd09880  # v3.2.33
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
