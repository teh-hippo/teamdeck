name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@2485d1fee6af1e1282dddc0ad7bf78e6efb92e43  # v3.3.1
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
