name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@132e34daece974042b5b14aa69599c1c911b787b  # v3.2.28
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
