name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@facf9307947cd4c732fbeaed0d566cd29a8350ea  # v3.5.3
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
