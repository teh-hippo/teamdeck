name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@1c2112932cff19f1a1a5adfa788d9d833d9729af  # v3.2.37
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
