name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@b5107940ef8e5d69e80ecf781b7493aa808d8b19  # v3.5.18
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
