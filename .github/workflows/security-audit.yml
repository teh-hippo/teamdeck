name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@0c21b872e5202e5b87ad7fd482fd64d391f8b60d  # v3.5.8
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
