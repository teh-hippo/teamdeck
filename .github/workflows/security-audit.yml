name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@5186f7fdfe9036a0a6d69c7f3a673f639dc9534d  # v3.2.32
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
