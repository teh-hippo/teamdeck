name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@a5ad467f2589e41475a5859f6bd4e7dd027d8a63  # v3.2.20
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
