name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@b2c7dad9076f0fe25d46d05865ca9f5b2c360947  # v3.2.4
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
