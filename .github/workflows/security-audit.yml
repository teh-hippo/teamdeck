name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@53d1fc8ee012e7fba482104fdb2d779eff892348  # v3.2.14
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
