name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@109668e1c86560a3bc50aa184d341d4258b77a8b  # v3.5.12
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
