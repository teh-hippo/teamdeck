name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@af0e1faf47f43132bc288c7fdb5aff4cb587d89c  # v3.2.35
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
