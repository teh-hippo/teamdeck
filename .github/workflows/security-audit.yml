name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@066eefc9351dc792c477eee3fcfc6231cd0a4c17  # v3.2.29
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
