name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@6706a4f03960bd5bd2fc6834d02cf2453b220aa3  # v3.5.1
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
