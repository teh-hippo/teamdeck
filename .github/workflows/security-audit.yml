name: Security Audit

on:
  push:
    branches: [main]
    paths: ["native/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: teh-hippo/common-repo-configs/.github/workflows/security-audit.yml@d18e923cbd49d67099fabe46a9dca9cad17c3223  # v3.2.24
    permissions:
      contents: read
      issues: write
      checks: write
    with:
      working-directory: native
