name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@cdc6cb21f67428d53742baec302ab074f93014e6  # v3.5.19
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
