name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@818b20188987583b2dfefb1c04f9c898fa8f0d87  # v3.2.16
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
