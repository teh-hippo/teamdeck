name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@b5107940ef8e5d69e80ecf781b7493aa808d8b19  # v3.5.18
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
