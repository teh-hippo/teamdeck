name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@6b856d362cc47fe0387eeb6349d29376c5abb35c  # v3.5.11
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
