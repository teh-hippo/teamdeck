name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@a5ad467f2589e41475a5859f6bd4e7dd027d8a63  # v3.2.20
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
