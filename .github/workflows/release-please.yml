name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@273586e2942b6a33b4c4c82754d33b738ee00a7e  # v3.2.23
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
