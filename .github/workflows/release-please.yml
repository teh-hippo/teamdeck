name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@5186f7fdfe9036a0a6d69c7f3a673f639dc9534d  # v3.2.32
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
