name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@d18e923cbd49d67099fabe46a9dca9cad17c3223  # v3.2.24
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
