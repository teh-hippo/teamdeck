name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@4ca742eda76e2a05421784306ae95f5f36958b4d  # v3.2.13
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
