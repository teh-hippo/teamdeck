name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@c1f6e14d19d179825ee1d4a691a86b3adb943a5e  # v3.5.9
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
