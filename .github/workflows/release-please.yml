name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@b2c7dad9076f0fe25d46d05865ca9f5b2c360947  # v3.2.4
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
