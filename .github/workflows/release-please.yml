name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@ce9adfb359fc249f59717d9f72aa4d3052e850cf  # v3.5.5
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
