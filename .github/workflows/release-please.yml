name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@d71c5d1def95b72227ef165825d3f6d51affa46b  # v3.2.6
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
