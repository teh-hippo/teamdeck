name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@480653c2278884104b02bb6f1f5d7ec82842d572  # v3.2.30
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
