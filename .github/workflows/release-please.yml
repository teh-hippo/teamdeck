name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@facf9307947cd4c732fbeaed0d566cd29a8350ea  # v3.5.3
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
