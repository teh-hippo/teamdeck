name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@ce951a05c44777e6336bf5735f740c915251e141  # v3.2.8
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
