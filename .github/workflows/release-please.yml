name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@132e34daece974042b5b14aa69599c1c911b787b  # v3.2.28
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
