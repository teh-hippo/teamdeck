name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@74d034769502f1c91c91c58b524ac912733e5c98  # v3.2.5
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
