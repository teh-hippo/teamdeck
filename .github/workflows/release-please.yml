name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@1ce408bcb79902cdc160a6aa302c3c0c9dc9e594  # v3.5.20
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
