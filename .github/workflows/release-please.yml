name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@5928973d0de2de7076a3e0d2f32c14556e0c436e  # v3.2.27
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
