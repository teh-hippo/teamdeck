name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@42a6dbffdbffd3fd5c1f2106dba4be2bc2c07cc8  # v3.5.4
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
