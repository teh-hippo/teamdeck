name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@ad26197ebad36b814419e459eda8c7253cb161d9  # v3.5.7
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
