name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@01954ab5428ef027016e06c69d0d68389737f299  # v3.5.2
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
