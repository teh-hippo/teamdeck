name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@a511f54718e6710945af5ee1509ed8408636b6bb  # v3.2.12
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
