name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@109668e1c86560a3bc50aa184d341d4258b77a8b  # v3.5.12
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
