name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@cb3f6e4957f9233f9587728af358a1b2b764229a  # v3.2.19
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
