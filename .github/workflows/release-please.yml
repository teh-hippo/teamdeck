name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@13fb2aefcc3338175d823cf867c841868ff6d4c8  # v3.5.17
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
