name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@b931aca4b15cb636891d2037f3cc9b7bfd33e2c3  # v3.4.0
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
