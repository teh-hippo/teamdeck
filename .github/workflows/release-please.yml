name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@2ef31dcb7762991f63ff1feda56b08a013f8fb34  # v3.2.3
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
