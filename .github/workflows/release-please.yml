name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@af0e1faf47f43132bc288c7fdb5aff4cb587d89c  # v3.2.35
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
