name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@066eefc9351dc792c477eee3fcfc6231cd0a4c17  # v3.2.29
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
