name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@8dd872601215a5a490cf84bbca444f471ccadce5  # v3.5.6
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
