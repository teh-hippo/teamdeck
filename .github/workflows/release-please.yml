name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@4f262c45ec03f02a27a401c73ac7d87ece2da5aa  # v3.2.18
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
