name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@f9387d1201e2c7e31ccdd7a1a04152f2f31ac557  # v3.2.26
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
