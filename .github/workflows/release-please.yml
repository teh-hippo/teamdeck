name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@778f7142cbecf7575c087348541a2cf06fd09880  # v3.2.33
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
