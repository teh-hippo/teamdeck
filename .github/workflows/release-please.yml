name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@be8902b405b3302103da109a66c29d539800289d  # v3.2.9
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
