name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@6706a4f03960bd5bd2fc6834d02cf2453b220aa3  # v3.5.1
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
