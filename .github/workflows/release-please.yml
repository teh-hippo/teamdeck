name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@0c21b872e5202e5b87ad7fd482fd64d391f8b60d  # v3.5.8
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
