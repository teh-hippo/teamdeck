name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@1c2112932cff19f1a1a5adfa788d9d833d9729af  # v3.2.37
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
