name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@2b812790ff0a2cec9bd31eeae1f62876485746b3  # v3.2.7
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
