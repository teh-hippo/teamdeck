name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@b6757ad28cf4fae44c99a5a462bc14cf19dce1ab  # v3.5.0
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
