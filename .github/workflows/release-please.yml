name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@3472be29741b4b64888144d58766c9e84dc07b78  # v3.2.0
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
