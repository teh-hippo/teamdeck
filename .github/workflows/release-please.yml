name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@52305ee7afe0528969eb59110bc876ac7092669b  # v3.2.11
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
