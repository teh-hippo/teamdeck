name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@d29dea586d85c4e459e4beffa1ae21b40d12094f  # v3.2.25
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
