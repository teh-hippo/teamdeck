name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@2485d1fee6af1e1282dddc0ad7bf78e6efb92e43  # v3.3.1
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
