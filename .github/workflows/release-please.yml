name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@72e2489476fe188b6728387a839e843bef87c1a9  # v3.2.17
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
