name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@0cefd797b02a13469434b002d89a787487349670  # v3.2.22
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
