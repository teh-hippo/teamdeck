name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@5fa0d421729c9ac2c385f7b8248a89db5e4dbddd  # v3.2.31
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
