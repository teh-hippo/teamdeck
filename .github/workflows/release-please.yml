name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@eee488b0ce33a69705c74bfbff0aa4ebc67c68e8  # v3.5.10
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
