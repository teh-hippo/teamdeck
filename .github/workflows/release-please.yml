name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@04132673f8dbfe520b09cdc14fc08c83c34ea6bf  # v3.5.15
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
